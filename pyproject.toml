[project]
name = "voltarget"
version = "1.0.0"
description = "Levered vol-target overlay with MA regime cap, tested out of sample with realistic costs, financing and margin"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "yfinance>=0.2.40"]

[project.scripts]
voltarget = "voltarget.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltarget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
